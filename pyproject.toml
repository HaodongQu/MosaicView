[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mosaic-view"
version = "1.1.0"
description = "PyQt5 desktop image comparison tool with synchronized views and sliding overlays."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE.txt" }
authors = [
  { name = "Lars Maxfield" }
]
dependencies = [
  "PyQt5>=5.15,<6",
  "piexif>=1.1.3",
]

[project.urls]
Homepage = "https://github.com/halley/MosaicView"

[project.scripts]
mosaic-view = "mosaic_view.app.bootstrap:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["mosaic_view*"]

[tool.setuptools.package-data]
mosaic_view = [
  "icons.qrc",
  "icons/*",
]
